# Chocofi keycap set: MBK caps, one legend per ZMK layer, four filaments.
# tools/zmk_to_legends.py merges this file with the legends read from the
# ZMK keymap and writes chocofi/chocofi.json for main.py.

[zmk]
# keymap-drawer output of the ZMK config repository (regenerated by its CI)
keymap_yaml = "C:/Development/bbens/personal/zmk-chocofi/img/corne.yaml"
# Layer per legend slot: primary, secondary, tertiary (in this order)
layers = ["Base", "Num", "Sym"]
# Template group per key position (0-35, keymap order); others use "default"
default_group = "mbk_1u"
[zmk.groups]
mbk_1u_homing = [13, 16]  # F, J
mbk_15u = [32, 33]        # inner thumbs: Space, Enter

[settings]
font = "Bahnschrift"
# Slot positions in mm from the cap center (+x right, +y away from the typist)
primary_font_size = 5.5    # Base layer: large, top-left
primary_x_offset = -3.0
primary_y_offset = 2.2
secondary_font_size = 4.0  # Num layer: small, top-right
secondary_x_offset = 3.9
secondary_y_offset = 3.3
tertiary_font_size = 4.0   # Sym layer: small, bottom-right
tertiary_x_offset = 3.9
tertiary_y_offset = -3.3
center_single_legend = false
baseline_align = true       # keep ' high and _ low instead of centering every glyph
bold_offset = 0.08         # thickens the Base legend strokes
small_bold_offset = 0.03   # small legends: more would close the gaps in = and "
max_carve_depth = 0.6      # MBK top wall is 1.47mm thick at the center
# Bambu Studio filament slots (AMS Lite: 1-4)
body_filament = 1
legend_1_filament = 2      # Base
legend_2_filament = 3      # Num
legend_3_filament = 4      # Sym

# MBK Choc keycaps by darryldh (CC BY-NC) - referenced, not part of this repo
[step_files.mbk_1u]
path = "C:/Development/bbens/personal/MBK Choc Low Profile Keycaps/files/MBK_Keycap_-_1u.step"
has_stem = true

[step_files.mbk_1u_homing]
path = "C:/Development/bbens/personal/MBK Choc Low Profile Keycaps/files/MBK_Keycap_-_1u_Homing.step"
has_stem = true

[step_files.mbk_15u]
path = "C:/Development/bbens/personal/MBK Choc Low Profile Keycaps/files/MBK_Keycap_-_1.5u.step"
has_stem = true
