# Chocofi keycap set: MBK caps, one legend per ZMK layer, four filaments.
# tools/zmk_to_legends.py merges this file with the legends read from the
# ZMK keymap and writes chocofi/chocofi.json for main.py.

[zmk]
# Paths in this file are relative to the repository root, where the commands
# are run. The ZMK repo and the MBK folder sit next to this repository.
# keymap-drawer output of the ZMK config repository (regenerated by its CI)
keymap_yaml = "../zmk-chocofi/img/corne.yaml"
# Layer per legend slot: primary, secondary, tertiary (in this order)
layers = ["Base", "Num", "Sym"]
# Template group per key position (0-35, keymap order); others use "default"
default_group = "mbk_1u"
[zmk.groups]
mbk_1u_homing = [13, 16]  # F, J
mbk_15u = [32, 33]        # inner thumbs: Space, Enter

[settings]
# OCCT/build123d family name for Iosevka Nerd Font Mono (NF=Nerd Font,
# M=Mono). Alternatives: "Iosevka NF", "Iosevka NFP" (proportional).
font = "Iosevka NFM"
# Slot positions in mm from the cap center (+x right, +y away from the typist)
# All three legends share one font size (4.5 mm).
primary_font_size = 10.0    # Base layer: top-left
primary_x_offset = -4.5
primary_y_offset = 4.0
secondary_font_size = 8.0  # Num layer: top-right
secondary_x_offset = 0.0
secondary_y_offset = -2.0
tertiary_font_size = 8.0   # Sym layer: bottom-right
tertiary_x_offset = 3.5
tertiary_y_offset = 4.75
center_single_legend = false
baseline_align = true       # keep ' high and _ low instead of centering every glyph
bold_offset = 0.0         # thickens the Base legend strokes
small_bold_offset = 0.0   # small legends: more would close the gaps in = and "
max_carve_depth = 0.4      # shallower carve -> fewer color layers, less purge
# Bambu Studio filament slots (AMS Lite: 1-4). One color per legend:
# body=1, Base=2, Num=3, Sym=4.
body_filament = 1
legend_1_filament = 2      # Base
legend_2_filament = 3      # Num
legend_3_filament = 4      # Sym

# Kailh choc cap (in-repo STEP). The source file is modeled stem-up with the
# legend/typing face at Zmin (for upside-down printing); main.py carves the top
# (max Z) face, so tools/flip_cap.py writes a 180deg-flipped copy with the typing
# face up. The stem is part of the geometry (has_stem). One 1u cap for all keys.
[step_files.mbk_1u]
path = "assets/my-kailh-v0.0.2_flipped.step"
has_stem = true

[step_files.mbk_1u_homing]
path = "assets/my-kailh-v0.0.2_flipped.step"
has_stem = true

[step_files.mbk_15u]
path = "assets/my-kailh-v0.0.2_flipped.step"
has_stem = true
